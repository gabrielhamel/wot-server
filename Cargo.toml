[workspace]
members = [
    "tools/wot-binary-map",
    "tools/wot-context-maps",
    "tools/wot-extract",
    "tools/wot-game-client",
    "tools/wot-replay",
    "tools/wot-resources",
]
resolver = "3"

[workspace.package]
version = "0.15.0"

[package]
name = "wot-server"
version.workspace = true
edition = "2024"
license = "MIT"
default-run = "wot-server"

[features]
integration-test-support = []

[[test]]
name = "ammunition"
required-features = ["integration-test-support"]

[[test]]
name = "garage"
required-features = ["integration-test-support"]

[[test]]
name = "modules"
required-features = ["integration-test-support"]

[[test]]
name = "rsa_login"
required-features = ["integration-test-support"]

[[test]]
name = "transport_resilience"
required-features = ["integration-test-support"]

[[test]]
name = "vehicles"
required-features = ["integration-test-support"]

[dependencies]
wot-resources = { path = "tools/wot-resources" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"

argon2 = "0.5"
async-trait = "0.1.92"
blowfish = "0.9"
crc32fast = "1.4"
flate2 = "1"
png = "0.17"

rsa = "0.8"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "migrate", "macros", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net", "io-util"] }
tracing = "0.1"
tracing-subscriber = "0.3"
opentelemetry = "0.33"
opentelemetry-appender-tracing = "0.33"
opentelemetry-otlp = { version = "0.33", features = ["reqwest-rustls"] }
opentelemetry_sdk = "0.33"
tracing-opentelemetry = { version = "0.34", default-features = false }
bitflags = "2.6"
byteorder = "1.5"
glam = "0.29"
indexmap = "2.6"
paste = "1"
sha1 = "0.10"
smallvec = "1.13"
thiserror = "1"
unicode-properties = { version = "0.1", default-features = false, features = ["general-category"] }

base64 = "0.22"
quick-xml = "0.38"
roxmltree = "0.20"
chrono = { version = "0.4", default-features = false, features = ["std"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "matched-path", "query", "tokio"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["service", "tokio"] }
tower-http = { version = "0.6.11", features = ["fs"] }
subtle = "2.6"
reqwest = { version = "0.13", default-features = false }
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic-messages", "trace"] }
prost = "0.14"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic-messages", "trace", "logs", "metrics"] }
opentelemetry_sdk = { version = "0.33", features = ["testing"] }

[package]
name = "wot-binary-map"
version.workspace = true
edition = "2024"
license = "MIT"

[[bin]]
name = "wg-binary-map"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
iced-x86 = { version = "1.22.0", default-features = false, features = ["std", "decoder", "instr_info"] }
msvc-demangler = "0.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"

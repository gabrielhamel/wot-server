[package]
name = "wot-game-client"
version.workspace = true
edition = "2024"
license = "MIT"

[[bin]]
name = "game-client"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dunce = "1.0.5"
home = "0.5.12"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"

name: Set up native E2E
description: Configure Node, Rust, and the E2E cache on the job runner.

inputs:
  cache-root:
    description: Absolute CI cache directory on the runner.
    required: true
  persistent:
    description: Whether the runner provides a persistent local Cargo cache.
    default: 'false'

runs:
  using: composite
  steps:
    - name: Configure native build paths
      shell: bash
      env:
        CACHE_ROOT: ${{ inputs.cache-root }}
        PERSISTENT: ${{ inputs.persistent }}
      run: |
        for command in cc pkg-config python3 jq flock docker; do
          command -v "$command" >/dev/null || {
            echo "::error::The E2E runner must provide $command."
            exit 1
          }
        done
        mkdir -p "$CACHE_ROOT"
        {
          echo "WOT_CI_CACHE=$CACHE_ROOT"
          echo "CARGO_PROFILE_DEV_DEBUG=0"
          echo "CARGO_INCREMENTAL=0"
          if [[ "$PERSISTENT" == true ]]; then
            echo "CARGO_HOME=$CACHE_ROOT/cargo"
            echo "CARGO_TARGET_DIR=$CACHE_ROOT/target"
            echo "RUSTUP_HOME=$CACHE_ROOT/rustup"
            echo "CARGO_BUILD_JOBS=2"
          fi
        } >> "$GITHUB_ENV"

    - uses: actions/setup-node@v6
      with:
        node-version: '22'
        package-manager-cache: false

    - name: Install Rust
      shell: bash
      run: |
        rustup_bin="${CARGO_HOME:-$HOME/.cargo}/bin"
        if [[ ! -x "$rustup_bin/rustup" ]]; then
          installer=$(mktemp "$RUNNER_TEMP/rustup.XXXXXX")
          trap 'rm -f -- "$installer"' EXIT
          curl --fail --silent --show-error --location --retry 3 https://sh.rustup.rs --output "$installer"
          sh "$installer" -y --profile minimal --default-toolchain none --no-modify-path
        fi
        "$rustup_bin/rustup" toolchain install stable --profile minimal
        echo "$rustup_bin" >> "$GITHUB_PATH"

    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      if: inputs.persistent != 'true'
      with:
        cache-bin: false
        shared-key: native-e2e

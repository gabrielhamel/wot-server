name: Extract current EU game resources
description: Update the cached production client and prepare its versioned server resource bundle.

inputs:
  working-directory:
    description: Path to the server checkout to build and test.
    default: .

outputs:
  game-version:
    description: Game version from the extracted resource manifest.
    value: ${{ steps.extract.outputs.game-version }}
  resources:
    description: Absolute path to the extracted bundle on this runner.
    value: ${{ steps.extract.outputs.resources }}

runs:
  using: composite
  steps:
    - name: Install wg-launcher
      shell: bash
      env:
        LAUNCHER_VERSION: '1.5.1'
        LAUNCHER_SHA256: 5dbbb90755ac013a157ae657af18110a6d78dc563d45b500452303b9e09418cc
      run: |
        archive=wg-launcher-cli-x86_64-unknown-linux-gnu
        launcher_dir=$(mktemp -d "$RUNNER_TEMP/wg-launcher.XXXXXX")
        cd "$launcher_dir"
        curl --fail --silent --show-error --location --retry 3 \
          --output "$archive.tar.gz" \
          "https://github.com/gabrielhamel/wg-launcher/releases/download/$LAUNCHER_VERSION/$archive.tar.gz"
        echo "$LAUNCHER_SHA256  $archive.tar.gz" | sha256sum --check
        tar -xzf "$archive.tar.gz" "$archive/wg-launcher"
        echo "$launcher_dir/$archive" >> "$GITHUB_PATH"

    - name: Prepare current EU client resources
      id: extract
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: bash "$GITHUB_ACTION_PATH"/../../scripts/prepare-game-resources.sh

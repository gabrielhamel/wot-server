name: Run E2E tests
description: Run the native Cargo suite against current client resources and fresh PostgreSQL.

inputs:
  resources:
    description: Absolute path to the resource bundle on the Actions runner.
    required: true
  working-directory:
    description: Path to the server checkout to build and test.
    default: .

runs:
  using: composite
  steps:
    - name: Run native E2E with PostgreSQL
      shell: bash
      env:
        WOT_RESOURCE_DIR: ${{ inputs.resources }}
      working-directory: ${{ inputs.working-directory }}
      run: bash "$GITHUB_ACTION_PATH"/../../scripts/run-e2e.sh

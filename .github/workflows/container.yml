name: Publish server image

on:
  push:
    tags: ['**']
  workflow_dispatch:
  workflow_call:
    inputs:
      publish:
        description: Allow a caller to publish a missing release image.
        type: boolean
        default: false
    outputs:
      published-image:
        description: Fully qualified release image tag pushed by this run.
        value: ${{ jobs.publish.outputs.published-image }}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: "github.event_name != 'push' || (github.ref_type == 'tag' && github.event.created && !github.event.deleted)"
    concurrency:
      group: publish-server-image
      cancel-in-progress: false
    runs-on: [self-hosted, linux, x64, wot-server-image]
    timeout-minutes: 180
    outputs:
      published-image: ${{ steps.push.outputs.published-image }}
    defaults:
      run:
        shell: bash
        working-directory: release
    env:
      DOCKER_BUILDKIT: '1'
    steps:
      - name: Select server release
        id: release
        working-directory: .
        run: |
          release_ref="$GITHUB_SHA"
          release_tag="$GITHUB_REF_NAME"
          if [[ "$GITHUB_EVENT_NAME" != push ]]; then
            release_ref=$(git ls-remote --tags --refs --sort=-version:refname \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" | awk '
                $2 ~ /^refs\/tags\/[0-9]+(\.[0-9]+){1,2}$/ && !found { print $2; found = 1 }
              ')
            if [[ -z "$release_ref" ]]; then
              echo "::error::No numeric server release tag found."
              exit 1
            fi
            release_tag="${release_ref#refs/tags/}"
          fi
          echo "ref=$release_ref" >> "$GITHUB_OUTPUT"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Check out the CI workflow scripts
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github

      - name: Check out the server release
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.ref }}
          path: release
          persist-credentials: false

      - uses: ./.github/actions/setup-native-e2e
        with:
          cache-root: /cache/wot
          persistent: 'true'
      - uses: ./.github/actions/extract-game-resources
        id: extract
        with:
          working-directory: release

      - name: Compute image tags
        id: image
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          BUNDLE_VERSION: ${{ steps.extract.outputs.game-version }}
        run: |
          if ! bundle_version=$(jq -ner --arg version "$BUNDLE_VERSION" '
            $version | select(test("^(v\\.)?[0-9]+(\\.[0-9]+){3}([[:blank:]]+#[0-9]+)?\\z"))
          '); then
            echo "::error::Missing or invalid game version from the resource manifest"
            exit 1
          fi
          game_version=$(jq -nr --arg version "$bundle_version" '
            $version | ltrimstr("v.") | sub("[[:blank:]]+#"; "-")
          ')
          printf 'Extracted client version %s uses tag prefix %s\n' "$bundle_version" "$game_version"
          revision=$(git rev-parse HEAD)
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          commit_image="$image:${game_version}-${revision}"
          ref_tag=$(printf '%s' "$RELEASE_TAG" | LC_ALL=C tr -c 'a-zA-Z0-9_.-' '-')
          prefix="${game_version}-"
          if [[ "$ref_tag" != "$RELEASE_TAG" || "$ref_tag" =~ ^[0-9a-f]{40}$ ]] ||
            (( ${#prefix} + ${#ref_tag} > 128 )); then
            ref_hash=$(printf '%s' "$RELEASE_TAG" | sha256sum | cut -c1-16)
            ref_tag="${ref_tag:0:$((128 - ${#prefix} - 17))}-$ref_hash"
          fi
          {
            echo "revision=$revision"
            echo "commit=$commit_image"
            echo "game_version=$game_version"
            echo "bundle_version=$bundle_version"
            echo "tag=$image:$prefix$ref_tag"
            echo "latest=$image:latest"
          } >> "$GITHUB_OUTPUT"

      - name: Check whether the release image already exists
        if: github.event_name != 'push' && inputs.publish
        id: registry
        env:
          TAG_IMAGE: ${{ steps.image.outputs.tag }}
        run: |
          image="${TAG_IMAGE#ghcr.io/}"
          package="${image%:*}"
          tag="${image##*:}"
          token=$(curl --fail --silent --show-error --max-time 30 --get https://ghcr.io/token \
            --data-urlencode 'service=ghcr.io' --data-urlencode "scope=repository:$package:pull" |
            jq -er '.token | strings | select(length > 0)')
          response=$(mktemp)
          trap 'rm -f "$response"' EXIT
          status=$(curl --silent --show-error --max-time 30 --output "$response" --write-out '%{http_code}' \
            --header "Authorization: Bearer $token" \
            --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/$package/manifests/$tag")
          if [[ "$status" == 200 ]]; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
            printf 'Image `%s` already exists.\n' "$TAG_IMAGE" >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$status" == 404 ]] && jq -e 'any(.errors[]; .code == "MANIFEST_UNKNOWN")' "$response" >/dev/null; then
            printf 'Image %s is missing.\n' "$TAG_IMAGE"
          else
            printf '::error::GHCR image lookup failed for %s (HTTP %s).\n' "$TAG_IMAGE" "$status"
            exit 1
          fi

      - name: Run native E2E from the release checkout
        if: steps.registry.outputs.exists != 'true'
        uses: ./.github/actions/run-e2e
        with:
          resources: ${{ steps.extract.outputs.resources }}
          working-directory: release

      - name: Build and check the server image
        if: steps.registry.outputs.exists != 'true'
        id: build
        env:
          IMAGE: ${{ steps.image.outputs.commit }}
          REVISION: ${{ steps.image.outputs.revision }}
          GAME_VERSION: ${{ steps.image.outputs.game_version }}
          BUNDLE_VERSION: ${{ steps.image.outputs.bundle_version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RESOURCE_DIR: ${{ steps.extract.outputs.resources }}
        run: |
          cp -a -- "$RESOURCE_DIR" resources
          chmod -R a+rX resources
          docker build --provenance=false --tag "$IMAGE" \
            --build-arg WOT_SERVER_VERSION="$RELEASE_TAG" \
            --build-arg WOT_GAME_VERSION="$GAME_VERSION" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$REVISION" \
            --label "io.github.gabrielhamel.wot-server.game-version=$GAME_VERSION" .
          image_manifest=$(docker run --rm --entrypoint /bin/sh "$IMAGE" -ec '
            test -x ./wot-server
            test -w .
            test -s resources/manifest.json
            test -s web/index.html
            test -d web/assets
            test -s dashboard/index.html
            libraries=$(ldd ./wot-server)
            printf "%s\n" "$libraries" >&2
            case "$libraries" in *"not found"*) exit 1;; esac
            cat resources/manifest.json
          ')
          image_version=$(jq -er '.game_version | strings' <<< "$image_manifest")
          if [[ "$image_version" != "$BUNDLE_VERSION" ]]; then
            printf '::error::Image bundle version %s does not match tag source %s\n' \
              "$image_version" "$BUNDLE_VERSION"
            exit 1
          fi

      - name: Check packaged server startup
        if: steps.registry.outputs.exists != 'true'
        env:
          IMAGE: ${{ steps.image.outputs.commit }}
          POSTGRES_IMAGE: docker.io/library/postgres:18@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        run: |
          smoke="wot-smoke-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cleanup() {
            docker rm -fv "$smoke-server" "$smoke-db" >/dev/null 2>&1 || true
            docker network rm "$smoke" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker network create --internal "$smoke"
          docker run -d --name "$smoke-db" --network "$smoke" --network-alias postgres \
            -e POSTGRES_USER=wot_smoke -e POSTGRES_PASSWORD=ci-only "$POSTGRES_IMAGE"
          for attempt in {1..60}; do
            if docker exec "$smoke-db" pg_isready -h 127.0.0.1 -U wot_smoke -d wot_smoke; then
              break
            fi
            if [[ $attempt == 60 ]]; then
              docker logs "$smoke-db"
              exit 1
            fi
            sleep 1
          done
          docker run -d --name "$smoke-server" --network "$smoke" \
            -e WOT_DATABASE_URL=postgresql://wot_smoke:ci-only@postgres:5432/wot_smoke \
            "$IMAGE" --resource-dir resources --private-key login.pem --log-level info
          ready=false
          for attempt in {1..60}; do
            if [[ $(docker inspect --format '{{.State.Running}}' "$smoke-server") != true ]]; then
              break
            fi
            if docker logs "$smoke-server" 2>&1 | grep -F 'Web HTTP listener started' >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            docker logs "$smoke-server"
            exit 1
          fi
          docker stop "$smoke-server"

      - name: Publish to GitHub Container Registry
        if: steps.registry.outputs.exists != 'true' && (github.event_name == 'push' || inputs.publish)
        id: push
        env:
          GHCR_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.image.outputs.commit }}
          TAG_IMAGE: ${{ steps.image.outputs.tag }}
          LATEST_IMAGE: ${{ steps.image.outputs.latest }}
        run: |
          DOCKER_CONFIG=$(mktemp -d "$RUNNER_TEMP/ghcr.XXXXXX")
          export DOCKER_CONFIG
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE"
          printf -- '- `%s`\n' "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
          # Push the release tag last so it marks a completed publication.
          for alias in "$LATEST_IMAGE" "$TAG_IMAGE"; do
            docker tag "$IMAGE" "$alias"
            docker push "$alias"
            printf -- '- `%s`\n' "$alias" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "published-image=$TAG_IMAGE" >> "$GITHUB_OUTPUT"

      - name: Remove local image tags and staged resources
        if: always() && steps.build.outcome != '' && steps.build.outcome != 'skipped'
        env:
          IMAGE: ${{ steps.image.outputs.commit }}
          TAG_IMAGE: ${{ steps.image.outputs.tag }}
          LATEST_IMAGE: ${{ steps.image.outputs.latest }}
        run: |
          for image in "$TAG_IMAGE" "$LATEST_IMAGE" "$IMAGE"; do
            docker image rm "$image" || true
          done
          rm -rf -- resources

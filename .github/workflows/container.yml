name: Publish server image

on:
  push:
    tags: ['**']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: "github.ref_type == 'tag' && github.event.created && !github.event.deleted"
    runs-on: [self-hosted, linux, x64, wot-server-image]
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      GAME_DIR: /cache/wot/eu-sd-en
      DOCKER_BUILDKIT: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install wg-launcher
        env:
          LAUNCHER_VERSION: '1.4.0'
          LAUNCHER_SHA256: 8e2c39741c435c38302474ad18ea067401edb1732ec1b673c66892085fd72ee0
        run: |
          archive=wg-launcher-cli-x86_64-unknown-linux-gnu
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$archive.tar.gz" \
            "https://github.com/gabrielhamel/wg-launcher/releases/download/$LAUNCHER_VERSION/$archive.tar.gz"
          echo "$LAUNCHER_SHA256  $archive.tar.gz" | sha256sum --check
          tar -xzf "$archive.tar.gz" "$archive/wg-launcher"
          echo "$RUNNER_TEMP/$archive" >> "$GITHUB_PATH"

      - name: Install or update the cached EU SD client
        run: |
          mkdir -p "$GAME_DIR"
          if [[ ! -f "$GAME_DIR/.wg-launcher/state.json" ]]; then
            wg-launcher install --game wot --region eu --client-type sd \
              --language EN --output "$GAME_DIR"
          fi
          wg-launcher update --path "$GAME_DIR"

      - name: Extract the server bundle
        run: |
          extractor="wot-extract-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker build --target extractor --tag "$extractor" .
          container=$(docker create --mount "type=bind,source=$GAME_DIR,target=/game,readonly" \
            "$extractor" /game --output /tmp/resources)
          trap 'docker rm -f "$container"; docker image rm "$extractor"' EXIT
          docker start --attach "$container"
          [[ $(docker inspect --format '{{.State.ExitCode}}' "$container") == 0 ]]
          docker cp "$container:/tmp/resources" ./resources

      - name: Compute image tags
        id: image
        run: |
          if ! bundle_version=$(jq -er '
            .game_version | strings
            | select(test("^(v\\.)?[0-9]+(\\.[0-9]+){3}([[:blank:]]+#[0-9]+)?\\z"))
          ' resources/manifest.json); then
            echo "::error::Missing or invalid game version in resources/manifest.json"
            exit 1
          fi
          game_version=$(jq -nr --arg version "$bundle_version" '
            $version | ltrimstr("v.") | sub("[[:blank:]]+#"; "-")
          ')
          printf 'Extracted client version %s uses tag prefix %s\n' "$bundle_version" "$game_version"
          revision=$(git rev-parse HEAD)
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          commit_image="$image:${game_version}-${revision}"
          {
            echo "revision=$revision"
            echo "commit=$commit_image"
            echo "game_version=$game_version"
            echo "bundle_version=$bundle_version"
            if [[ "$GITHUB_REF_TYPE" == tag ]]; then
              ref_tag=$(printf '%s' "$GITHUB_REF_NAME" | LC_ALL=C tr -c 'a-zA-Z0-9_.-' '-')
              prefix="${game_version}-"
              if [[ "$ref_tag" != "$GITHUB_REF_NAME" || "$ref_tag" =~ ^[0-9a-f]{40}$ ]] ||
                (( ${#prefix} + ${#ref_tag} > 128 )); then
                ref_hash=$(printf '%s' "$GITHUB_REF_NAME" | sha256sum | cut -c1-16)
                ref_tag="${ref_tag:0:$((128 - ${#prefix} - 17))}-$ref_hash"
              fi
              echo "tag=$image:$prefix$ref_tag"
              echo "latest=$image:latest"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Build and check the server image
        env:
          IMAGE: ${{ steps.image.outputs.commit }}
          REVISION: ${{ steps.image.outputs.revision }}
          GAME_VERSION: ${{ steps.image.outputs.game_version }}
          BUNDLE_VERSION: ${{ steps.image.outputs.bundle_version }}
        run: |
          docker build --provenance=false --tag "$IMAGE" \
            --build-arg WOT_SERVER_VERSION="$GITHUB_REF_NAME" \
            --build-arg WOT_GAME_VERSION="$GAME_VERSION" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$REVISION" \
            --label "io.github.gabrielhamel.wot-server.game-version=$GAME_VERSION" .
          image_manifest=$(docker run --rm --entrypoint /bin/sh "$IMAGE" -ec '
            test -x ./wot-server
            test -w .
            test -s resources/manifest.json
            test -s web/index.html
            test -d web/assets
            test -s dashboard/index.html
            test ! -e server.json
            libraries=$(ldd ./wot-server)
            printf "%s\n" "$libraries" >&2
            case "$libraries" in *"not found"*) exit 1;; esac
            cat resources/manifest.json
          ')
          image_version=$(jq -er '.game_version | strings' <<< "$image_manifest")
          if [[ "$image_version" != "$BUNDLE_VERSION" ]]; then
            printf '::error::Image bundle version %s does not match tag source %s\n' \
              "$image_version" "$BUNDLE_VERSION"
            exit 1
          fi

      - name: Start the packaged server with a fresh database
        env:
          IMAGE: ${{ steps.image.outputs.commit }}
          POSTGRES_IMAGE: docker.io/library/postgres:18@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        run: |
          smoke="wot-smoke-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          config_dir=$(mktemp -d "$RUNNER_TEMP/wot-smoke.XXXXXX")
          cleanup() {
            docker rm -fv "$smoke-server" "$smoke-db" >/dev/null 2>&1 || true
            docker network rm "$smoke" >/dev/null 2>&1 || true
            rm -rf "$config_dir"
          }
          trap cleanup EXIT
          cat > "$config_dir/server.json" <<'JSON'
          {
            "database_url": "postgresql://wot_smoke:ci-only@postgres:5432/wot_smoke",
            "web": { "bind": "127.0.0.1:8080", "ui_dir": "web" }
          }
          JSON
          chmod 644 "$config_dir/server.json"
          docker network create --internal "$smoke"
          docker run -d --name "$smoke-db" --network "$smoke" --network-alias postgres \
            -e POSTGRES_USER=wot_smoke -e POSTGRES_PASSWORD=ci-only "$POSTGRES_IMAGE"
          for attempt in {1..60}; do
            if docker exec "$smoke-db" pg_isready -h 127.0.0.1 -U wot_smoke -d wot_smoke; then
              break
            fi
            if [[ $attempt == 60 ]]; then
              docker logs "$smoke-db"
              exit 1
            fi
            sleep 1
          done
          docker create --name "$smoke-server" --network "$smoke" "$IMAGE" --log-level info
          docker cp "$config_dir/server.json" "$smoke-server:/opt/wot-server/server.json"
          docker start "$smoke-server"
          for attempt in {1..60}; do
            if [[ $(docker inspect --format '{{.State.Running}}' "$smoke-server") != true ]]; then
              break
            fi
            if docker logs "$smoke-server" 2>&1 | grep -F 'Web HTTP listener started' >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$smoke-server"
          exit 1

      - name: Publish to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.image.outputs.commit }}
          TAG_IMAGE: ${{ steps.image.outputs.tag }}
          LATEST_IMAGE: ${{ steps.image.outputs.latest }}
        run: |
          DOCKER_CONFIG=$(mktemp -d "$RUNNER_TEMP/ghcr.XXXXXX")
          export DOCKER_CONFIG
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE"
          printf -- '- `%s`\n' "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
          for alias in "$TAG_IMAGE" "$LATEST_IMAGE"; do
            if [[ -n "$alias" ]]; then
              docker tag "$IMAGE" "$alias"
              docker push "$alias"
              printf -- '- `%s`\n' "$alias" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Remove local image tags
        if: always() && steps.image.outputs.commit != ''
        env:
          IMAGE: ${{ steps.image.outputs.commit }}
          TAG_IMAGE: ${{ steps.image.outputs.tag }}
          LATEST_IMAGE: ${{ steps.image.outputs.latest }}
        run: |
          for image in "$TAG_IMAGE" "$LATEST_IMAGE" "$IMAGE"; do
            if [[ -n "$image" ]]; then
              docker image rm "$image" || true
            fi
          done

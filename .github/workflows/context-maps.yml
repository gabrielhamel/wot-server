name: Context maps

on:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'src/**'
      - 'crates/**'
      - 'docs/context-maps/**'
      - '!docs/context-maps/generated/**'
      - 'CONTEXT_MAP.md'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/config.toml'
      - '.github/workflows/context-maps.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: context-maps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      revision: ${{ steps.source.outputs.revision }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - id: source
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: false
      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install --yes graphviz
      - name: Validate and render context maps
        run: cargo +stable context-maps
      - uses: actions/upload-artifact@v4
        with:
          name: context-maps
          path: docs/context-maps/generated/*.svg
          if-no-files-found: error

  commit:
    needs: render
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Get context maps writer token
        id: writer
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CONTEXT_MAPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.CONTEXT_MAPS_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.render.outputs.revision }}
          token: ${{ steps.writer.outputs.token }}
      - name: Remove previous generated maps
        run: rm -f docs/context-maps/generated/*.svg
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: context-maps
          path: docs/context-maps/generated
      - name: Commit changed diagrams
        run: |
          git add -- docs/context-maps/generated
          if git diff --cached --quiet; then
            echo "Context maps are unchanged."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "docs: regenerate context maps"
          git push origin HEAD:main

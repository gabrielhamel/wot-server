name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust checks and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: false
      - name: Check formatting
        run: cargo +stable fmt --all --check
      - name: Clippy
        run: cargo +stable clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo +stable test --locked --workspace --all-targets

  e2e:
    name: E2E Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        env:
          POSTGRES_DB: wot_test
          POSTGRES_USER: wot_test
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U wot_test -d wot_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: false
      - name: Copy the EU 2.4.1.5514 resource fixture
        env:
          RESOURCE_IMAGE: ghcr.io/gabrielhamel/wot-server@sha256:2eaca561245af32e92b97c8f819d84d754d87c32f27dbcf5538b574c15e6b912
        run: |
          docker pull "$RESOURCE_IMAGE"
          container=$(docker create "$RESOURCE_IMAGE")
          trap 'docker rm "$container"' EXIT
          docker cp "$container:/opt/wot-server/resources" "$RUNNER_TEMP/wot-e2e-resources"
      - name: Run PostgreSQL and protocol E2E tests
        env:
          WG_RESOURCE_DIR: ${{ runner.temp }}/wot-e2e-resources
          WG_TEST_DATABASE_URL: postgresql://wot_test:ci-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/wot_test
        run: |
          cargo +stable test --locked --lib upgrades_legacy_context_storage -- --ignored
          cargo +stable test --locked --lib exports_admin_http -- --ignored
          cargo +stable test --locked -p wot-server --test garage -- --ignored

  web:
    name: Web UI checks and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check --workspace tools/web
      - run: npm run test --workspace tools/web
      - run: npm run build --workspace tools/web

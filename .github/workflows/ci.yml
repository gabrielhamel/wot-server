name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust checks and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: false
      - name: Check formatting
        run: cargo +stable fmt --all --check
      - name: Clippy
        run: cargo +stable clippy --locked --workspace --all-targets -- -D warnings
      - name: Clippy with integration fixtures
        run: cargo +stable clippy --locked --workspace --all-targets --features integration-test-support -- -D warnings
      - name: Test
        run: |
          cargo +stable test --locked --doc --workspace
          cargo +stable test --locked --workspace --all-targets --features integration-test-support
          test -s src/server-runtime/src/infrastructure/web/dist/index.html
          test -d src/server-runtime/src/infrastructure/web/dist/assets

  e2e:
    name: E2E Tests
    runs-on: ${{ vars.WOT_PR_E2E_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 180
    steps:
      - name: Require an isolated runner with a full client disk
        if: vars.WOT_PR_E2E_RUNNER == ''
        run: |
          echo "::error::Set WOT_PR_E2E_RUNNER to an isolated Linux x64 runner with enough storage for the EU client."
          exit 1
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-native-e2e
        with:
          cache-root: ${{ runner.temp }}/wot-ci
      - uses: ./.github/actions/extract-game-resources
        id: extract
      - uses: ./.github/actions/run-e2e
        with:
          resources: ${{ steps.extract.outputs.resources }}

  web:
    name: Web UI checks and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - run: cargo +stable web-build
      - run: npm run check --workspace src/server-runtime/src/infrastructure/web
      - run: npm run test --workspace src/server-runtime/src/infrastructure/web

name: Latest client E2E

on:
  schedule:
    - cron: '0 8 * * *'
      timezone: Europe/Paris
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: [self-hosted, linux, x64, wot-server-image]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-native-e2e
      - uses: ./.github/actions/extract-game-resources
        id: extract
      - uses: ./.github/actions/run-e2e
        with:
          resources: ${{ steps.extract.outputs.resources }}

  publish:
    needs: e2e
    if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    uses: ./.github/workflows/container.yml
    permissions:
      contents: read
      packages: write
    with:
      publish: true

  notify-discord:
    needs: [e2e, publish]
    if: >-
      always() && (needs.e2e.result == 'failure' || needs.publish.result == 'failure' ||
      (needs.publish.result == 'success' && needs.publish.outputs.published-image != ''))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Send Discord notification
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          E2E_RESULT: ${{ needs.e2e.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          PUBLISHED_IMAGE: ${{ needs.publish.outputs.published-image }}
        run: |
          if [[ -z "$DISCORD_WEBHOOK_URL" ]]; then
            echo "::error::Set the DISCORD_WEBHOOK_URL Actions secret to enable Discord notifications."
            exit 1
          fi
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [[ "$PUBLISH_RESULT" == success && -n "$PUBLISHED_IMAGE" ]]; then
            message=$(printf 'Latest client E2E published `%s`.\n%s' "$PUBLISHED_IMAGE" "$run_url")
          else
            message=$(printf 'Latest client E2E failed (E2E: %s, publish: %s).\n%s' \
              "$E2E_RESULT" "$PUBLISH_RESULT" "$run_url")
          fi
          jq -n --arg message "$message" '{
            content: $message,
            allowed_mentions: {parse: []}
          }' | curl --fail --silent --show-error --output /dev/null --max-time 30 \
            --header 'Content-Type: application/json' --data-binary @- "${DISCORD_WEBHOOK_URL}?wait=true"

name: Bug report
description: Report unexpected behavior in wot-server.
body:
  - type: input
    id: server-version
    attributes:
      label: Server version
      description: Give the release tag or commit SHA if known, or say which server you used.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include your OS, local or public server, and the World of Tanks region and build if the game client is involved.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: List the starting state and actions in order. Include the affected vehicle or item if relevant, and say how often the bug occurs.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: Include the visible result and any exact error message.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screen recording or screenshots
      description: >-
        Attach a short screen recording showing the problem if possible.
        If you can't record a video, attach screenshots showing the problem.
        Include relevant logs if available, and redact credentials, tokens,
        private keys, and personal information from all attachments.

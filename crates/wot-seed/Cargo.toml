[package]
name = "wot-seed"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "seed"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wot-resources = { path = "../wot-resources" }
wot-server = { path = "../.." }

[dev-dependencies]
flate2 = "1"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio"] }
